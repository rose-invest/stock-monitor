 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='美股机会价监控.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
const liveQuotes = new Map();
// V10: 报价按浏览器/网站来源持久化；不保存 API Key 到报价缓存。
const QUOTE_CACHE_KEY='stock_monitor_quotes_v10';
let quoteSaveTimer=null;
function saveQuoteCache(){
  if(quoteSaveTimer){clearTimeout(quoteSaveTimer);quoteSaveTimer=null;}
  try{
    const quotes={};
    for(const [symbol,q] of liveQuotes){
      if(positive(q.amount)&&positive(q.time))quotes[symbol]={p:q.amount,t:q.time};
    }
    localStorage.setItem(QUOTE_CACHE_KEY,JSON.stringify({version:1,savedAt:Date.now(),quotes}));
  }catch(e){console.warn('报价本地保存失败',e)}
}
function queueQuoteSave(){if(!quoteSaveTimer)quoteSaveTimer=setTimeout(saveQuoteCache,2000)}
try{
  const cached=JSON.parse(localStorage.getItem(QUOTE_CACHE_KEY)||'null');
  if(cached?.version===1 && cached.quotes && typeof cached.quotes==='object'){
    for(const [symbol,q] of Object.entries(cached.quotes)){
      if(byTrade.has(symbol)&&positive(q?.p)&&positive(q?.t)&&q.t<=Date.now()+60000)
        liveQuotes.set(symbol,{amount:q.p,time:q.t,source:'已保存'});
    }
  }
}catch(e){console.warn('读取已保存报价失败',e)}
// 共享报价：优先读取 GitHub Actions 发布的 quotes.json；不需要访客 API Key。
async function loadSharedQuotes(){
  try{
    const response=await fetch('./quotes.json?ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)return;
    const payload=await response.json();
    if(!payload || payload.version!==1 || !payload.quotes)return;
    let changed=false;
    for(const [symbol,q] of Object.entries(payload.quotes)){
      const amount=Number(q.p), time=Number(q.t);
      if(!byTrade.has(symbol)||!positive(amount)||!positive(time))continue;
      if((liveQuotes.get(symbol)?.time||0)>=time)continue;
      liveQuotes.set(symbol,{amount,time,source:'云端'});
      changed=true;
    }
    if(changed){saveQuoteCache();draw();}
    const el=document.getElementById('sharedQuoteStatus');
    if(el){
      const stamp=payload.updated_at?new Date(payload.updated_at).toLocaleString('zh-CN',{hour12:false}):'未知';
      el.textContent='云端行情：'+Object.keys(payload.quotes).length+'只 · 最近同步 '+stamp;
    }
  }catch(err){console.warn('云端报价暂不可用',err)}
}
loadSharedQuotes();
setInterval(loadSharedQuotes,300000);
window.addEventListener('pagehide',saveQuoteCache);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveQuoteCache()});
// 每一轮覆盖所有股票，优先检查接近首仓价的股票；缓存不计入本轮成功数。
const watched = [...byTrade.values()];
function nextRoundOrder(){
  return [...watched].sort((a,b)=>{
    const distance=x=>{const p=quote(x),target=positive(x.o1)?x.o1:0;return positive(p)&&target?Math.abs(p/target-1):Infinity};
    return distance(a)-distance(b);
  });
}
let connection;
let redrawTimer;
function refreshQuotes() {
  if (redrawTimer) return;
  redrawTimer = setTimeout(() => {
    redrawTimer = null;
    if (!document.activeElement?.matches('.quote-input')) draw();
  }, 1200);
}
function quoteLabel(x) {
  if (positive(overrides[x.trade])) return '手动';
  const live = liveQuotes.get(x.trade);
  if (!live) return '待获取报价';
  const time = new Date(live.time);
  const stamp = time.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+' '+time.toLocaleTimeString('zh-CN',{hour12:false});
  return live.source+' '+stamp;
}
function updateQuote(state, symbol, amount, time, source) {
  if (connection!==state || !byTrade.has(symbol) || !positive(amount) || !positive(time)) return;
  if ((liveQuotes.get(symbol)?.time || 0)>time) return;
  liveQuotes.set(symbol,{amount,time,source});
  saveQuoteCache();
  refreshQuotes();
}
function startStream(state) {
  const socket = new WebSocket('wss://ws.finnhub.io?token='+encodeURIComponent(state.key));
  state.socket = socket;
  socket.onopen = () => {
    if (connection!==state) return;
    for (const symbol of state.priority) socket.send(JSON.stringify({type:'subscribe',symbol:symbol}));
    $('streamStatus').textContent = '成交推送已连接';
  };
  socket.onmessage = event => {
    if (connection!==state) return;
    let message;
    try {message=JSON.parse(event.data)} catch {return}
    if (message.type==='error') $('streamStatus').textContent='成交订阅受限，继续轮询';
    if (message.type!=='trade'||!Array.isArray(message.data)) return;
    for (const trade of message.data) updateQuote(state,trade.s,trade.p,trade.t,'成交');
  };
  socket.onclose = () => {
    if (connection!==state) return;
    $('streamStatus').textContent='推送断开，轮询继续';
    state.reconnect=setTimeout(()=>startStream(state),30000);
  };
}
function stopQuotes(message='已暂停') {
  const state=connection;
  connection=null;
  if (state) {
    clearTimeout(state.timer);
    clearTimeout(state.reconnect);
    state.abort?.abort();
    state.socket?.close();
  }
  $('quoteStatus').textContent=message;
  $('streamStatus').textContent='';
  $('startQuotes').disabled=false;
  $('stopQuotes').disabled=true;
  for (const live of liveQuotes.values()) live.source='已保存';
  saveQuoteCache();
  refreshQuotes();
}
function pollProgress(state, extra='') {
  const completed=state.roundDone.size;
  const succeeded=state.roundOk.size;
  $('quoteStatus').textContent=`全部自动轮询 · 第${state.round}轮 ${completed}/${watched.length} 已检查 · ${succeeded}只取得有效报价`+(extra?' · '+extra:'');
}
async function pollQuote(state) {
  if (connection!==state) return;
  if(state.index>=state.order.length){
    state.round++;
    state.order=nextRoundOrder();
    state.index=0;
    state.roundDone=new Set();
    state.roundOk=new Set();
  }
  const symbol=state.order[state.index].trade;
  const url=new URL('https://finnhub.io/api/v1/quote');
  url.searchParams.set('symbol',symbol);
  url.searchParams.set('token',state.key);
  const controller=new AbortController();
  state.abort=controller;
  const timeout=setTimeout(()=>controller.abort(),8000);
  let delay=1250;
  let advance=true;
  try {
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if (connection!==state) return;
    if (response.status===401 || (response.status===403 && !state.authorized)) {
      stopQuotes('连接未获授权，请检查 API Key 或 Finnhub 账户权限。');
      return;
    }
    if (response.status===429) {
      advance=false;
      delay=65000;
      pollProgress(state,'API限流，65秒后重试当前股票');
    } else {
      state.roundDone.add(symbol);
      if (response.ok) {
        const data=await response.json();
        if (connection!==state) return;
        if (!state.authorized) {
          state.authorized=true;
          if (state.priority.length) startStream(state);
        }
        if(positive(data.c)&&positive(data.t)) {
          state.roundOk.add(symbol);
          updateQuote(state,symbol,data.c,data.t*1000,'轮询');
        }
      }
      pollProgress(state,response.ok?'':symbol+' 暂无报价或权限');
    }
  } catch {
    if (connection!==state) return;
    delay=15000;
    state.roundDone.add(symbol);
    pollProgress(state,'网络错误，15秒后继续');
  } finally {
    clearTimeout(timeout);
    if (connection===state) {
      if(advance) state.index++;
      state.timer=setTimeout(()=>pollQuote(state),delay);
    }
  }
}
const FINNHUB_STORAGE_KEY='stock_monitor_finnhub_key_v9';
const FINNHUB_SYMBOLS_KEY='stock_monitor_finnhub_symbols_v9';
function readStoredKey(){try{return localStorage.getItem(FINNHUB_STORAGE_KEY)||''}catch{return ''}}
function storeKey(key){try{localStorage.setItem(FINNHUB_STORAGE_KEY,key);return true}catch{return false}}
function forgetStoredKey(){try{localStorage.removeItem(FINNHUB_STORAGE_KEY);localStorage.removeItem(FINNHUB_SYMBOLS_KEY)}catch{}}
function connectQuotes(key){
  if (!key || connection) return;
  const codes=$('streamSymbols').value.toUpperCase().split(/[\s,，]+/).filter(Boolean);
  const priority=[...new Set(codes)].filter(code=>byTrade.has(code));
  if (priority.length>50 || priority.length!==new Set(codes).size) {
    $('quoteStatus').textContent='请输入名单中的交易代码，成交推送最多 50 只（不影响全部股票轮询）。';
    return;
  }
  if ($('rememberKey').checked) {
    if(!storeKey(key)) $('quoteStatus').textContent='浏览器不允许本地保存密钥，本次仍可连接';
    try{localStorage.setItem(FINNHUB_SYMBOLS_KEY,$('streamSymbols').value)}catch{}
  } else forgetStoredKey();
  $('finnhubKey').value='';
  $('quoteStatus').textContent='正在验证 Finnhub 连接…';
  $('startQuotes').disabled=true;
  $('stopQuotes').disabled=false;
  connection={key,priority,index:0,authorized:false,round:1,order:nextRoundOrder(),roundDone:new Set(),roundOk:new Set()};
  pollQuote(connection);
}
$('quoteConnect').addEventListener('submit',event=>{
  event.preventDefault();
  connectQuotes($('finnhubKey').value.trim());
});
$('forgetKey').onclick=()=>{
  forgetStoredKey();
  $('finnhubKey').value='';
  $('rememberKey').checked=false;
  stopQuotes('已删除此浏览器保存的密钥，并断开连接');
};
try{const savedSymbols=localStorage.getItem(FINNHUB_SYMBOLS_KEY);if(savedSymbols)$('streamSymbols').value=savedSymbols}catch{}
const savedFinnhubKey=readStoredKey();
if(savedFinnhubKey){
  $('rememberKey').checked=true;
  $('quoteStatus').textContent='检测到本地保存的密钥，正在自动连接…';
  connectQuotes(savedFinnhubKey);
}
/* original connection handler replaced */
$('stopQuotes').onclick=()=>stopQuotes();
$('list').addEventListener('focusout',()=>{if (liveQuotes.size) refreshQuotes()});

draw();

</script></body></html>

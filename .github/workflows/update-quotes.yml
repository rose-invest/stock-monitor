name: Update shared stock quotes
on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, UTC 13:00-22:59 Mon-Fri; Python filters NY 09:30-16:15.
    - cron: '*/30 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and save quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python update_quotes.py
      - name: Commit updated shared quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update shared Finnhub quotes"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
